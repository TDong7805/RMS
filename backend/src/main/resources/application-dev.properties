# Profile dev — mặc định khi chạy mvn spring-boot:run / IDE / dev.bat. KHÔNG dùng khi chạy thật.

# Nạp thêm dữ liệu mẫu (db/dev/V1_1__du_lieu_mau.sql): tài khoản mật khẩu Rms@2026, bàn, món, lịch đặt...
spring.flyway.locations=classpath:db/migration,classpath:db/dev
# CSDL rms_db tạo bằng các file SQL cũ (trước khi dùng Flyway) đã có cấu trúc + dữ liệu mẫu:
# Flyway đánh dấu V1 và V1.1 là đã chạy, chỉ chạy tiếp V2 trở đi. CSDL trống thì chạy từ đầu như bình thường.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1.1

# Frontend Vite chạy khác cổng mà gọi thẳng backend (không qua proxy của Vite).
rms.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173
