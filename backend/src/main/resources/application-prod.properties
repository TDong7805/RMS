# Profile prod — chạy thật: SPRING_PROFILES_ACTIVE=prod. Hướng dẫn đầy đủ: TRIEN_KHAI.md ở thư mục gốc repo.

# Không có giá trị mặc định: thiếu biến môi trường thì backend dừng ngay khi khởi động, báo rõ thiếu biến nào.
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Chỉ db/migration (cấu trúc + dữ liệu nền). Không có dữ liệu mẫu, không có tài khoản mẫu.
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Cookie phiên chỉ gửi qua HTTPS. Chỉ đặt COOKIE_SECURE=false khi chạy thử trong mạng nội bộ không có HTTPS.
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Tài khoản quản lý đầu tiên (com.rms.auth.BootstrapManager): đặt RMS_BOOTSTRAP_USERNAME, RMS_BOOTSTRAP_PASSWORD,
# RMS_BOOTSTRAP_EMAIL ở lần chạy đầu. Chỉ tạo khi CSDL chưa có quản lý nào; đăng nhập xong phải đổi mật khẩu.
