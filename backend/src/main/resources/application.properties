spring.application.name=rms-backend
# Nhiều nền tảng cloud cấp cổng qua biến PORT; chạy trên máy thì mặc định 8080.
server.port=${PORT:8080}

# ---------------------------------------------------------------- Môi trường
# dev  (mặc định): dữ liệu mẫu, cho phép frontend Vite gọi khác cổng.   → application-dev.properties
# prod (chạy thật): đặt SPRING_PROFILES_ACTIVE=prod.                     → application-prod.properties
spring.profiles.default=dev

# ---------------------------------------------------------------- CSDL
# Thông tin kết nối lấy từ biến môi trường hoặc file .env.properties (không đưa lên git) —
# xem backend/.env.properties.example. Hai đường dẫn: chạy từ thư mục backend/ hoặc thư mục gốc repo.
# Khi chạy thật, đặt file .env.properties cạnh file rms.jar hoặc dùng biến môi trường.
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties
# createDatabaseIfNotExist: CSDL chưa có thì tự tạo, Flyway tạo bảng. DB_SSL_MODE=REQUIRED khi CSDL ở máy khác.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rms_db}?characterEncoding=UTF-8&sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# NOW()/CURRENT_TIMESTAMP của MySQL theo giờ Việt Nam. Dùng độ lệch cố định thay vì tên vùng
# 'Asia/Ho_Chi_Minh' vì MySQL trên Windows thường chưa nạp bảng múi giờ (sẽ báo lỗi 1298).
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# Flyway tạo / nâng cấp CSDL khi khởi động: chạy lần lượt các file db/migration/V*.sql chưa chạy.
# File đã chạy thì không sửa nữa; đổi cấu trúc = thêm file V mới (xem backend/database/README.md).
spring.flyway.locations=classpath:db/migration
# Không thay ${...} trong file SQL (hash mật khẩu, nội dung tiếng Việt có thể chứa ký tự $).
spring.flyway.placeholder-replacement=false

# ---------------------------------------------------------------- Định dạng dữ liệu
# Múi giờ nhà hàng; mọi DATETIME trong CSDL là giờ địa phương này.
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=always
spring.jackson.deserialization.fail-on-unknown-properties=false

# Log tiếng Việt không bị lỗi font trên Windows (Java 17 mặc định dùng bảng mã của hệ điều hành).
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# ---------------------------------------------------------------- Phiên đăng nhập (com.rms.auth)
# Cookie HttpOnly: JavaScript không đọc được; SameSite=Lax: trang lạ không gửi kèm được khi POST tới API.
# Không chọn "Ghi nhớ đăng nhập" thì hết phiên sau 2 giờ không thao tác (chọn thì 7 ngày, xem AuthController).
# Phiên lưu trong MySQL (bảng SPRING_SESSION, tạo bởi db/migration/V2): khởi động lại backend không mất phiên.
server.servlet.session.cookie.name=RMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h
server.servlet.session.tracking-modes=cookie
spring.session.jdbc.initialize-schema=never

# ---------------------------------------------------------------- Chạy sau reverse proxy (Nginx, Caddy...)
# Đọc X-Forwarded-For / X-Forwarded-Proto do proxy gửi (chỉ tin proxy trong mạng nội bộ / cùng máy):
# nhật ký ghi đúng IP người dùng, Spring biết request gốc là HTTPS.
server.forward-headers-strategy=native
# Tắt máy chủ: chờ các request đang chạy xong rồi mới dừng (cập nhật phiên bản không làm hỏng thao tác dở).
server.shutdown=graceful

# ---------------------------------------------------------------- Theo dõi
# Chỉ mở GET /actuator/health → {"status":"UP"} (kiểm tra cả kết nối CSDL), không lộ chi tiết.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Tài khoản quản lý đầu tiên khi chạy thật (com.rms.auth.BootstrapManager). Đặt bằng biến môi trường hoặc
# trong .env.properties; chỉ dùng khi CSDL chưa có quản lý nào, không thì bỏ qua.
rms.bootstrap.username=${RMS_BOOTSTRAP_USERNAME:}
rms.bootstrap.password=${RMS_BOOTSTRAP_PASSWORD:}
rms.bootstrap.email=${RMS_BOOTSTRAP_EMAIL:}

# Frontend ở tên miền khác thì liệt kê ở đây (cách nhau dấu phẩy). Mặc định rỗng: frontend được phục vụ
# cùng địa chỉ với API (file jar đóng gói kèm frontend, hoặc reverse proxy) nên không cần CORS.
rms.cors.allowed-origins=${RMS_CORS_ALLOWED_ORIGINS:}
