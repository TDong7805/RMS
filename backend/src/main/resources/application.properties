spring.application.name=rms-backend
server.port=8080

# Kết nối MySQL (database/rms_schema.sql). Thông tin đăng nhập lấy từ biến môi trường
# hoặc file backend/.env.properties (không đưa lên git) — xem backend/.env.properties.example
# (Hai đường dẫn: chạy từ thư mục backend/ hoặc từ thư mục gốc repo đều tìm thấy file.)
spring.config.import=optional:file:.env.properties,optional:file:backend/.env.properties
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rms_db}?characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# NOW()/CURRENT_TIMESTAMP của MySQL theo giờ Việt Nam. Dùng độ lệch cố định thay vì tên vùng
# 'Asia/Ho_Chi_Minh' vì MySQL trên Windows thường chưa nạp bảng múi giờ (sẽ báo lỗi 1298).
spring.datasource.hikari.connection-init-sql=SET time_zone = '+07:00'

# Múi giờ nhà hàng; mọi DATETIME trong CSDL là giờ địa phương này.
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=always
spring.jackson.deserialization.fail-on-unknown-properties=false

# Log tiếng Việt không bị lỗi font trên Windows (Java 17 mặc định dùng bảng mã của hệ điều hành).
logging.charset.console=UTF-8
logging.charset.file=UTF-8

# Frontend (Vite) được phép gọi API khi chạy riêng cổng 5173/3000.
rms.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173

# Phiên đăng nhập (com.rms.auth). Cookie HttpOnly: JavaScript không đọc được; SameSite=Lax: trang lạ
# không gửi kèm được khi POST tới API. Không chọn "Ghi nhớ đăng nhập" thì hết phiên sau 2 giờ không thao tác
# (chọn thì 7 ngày, xem AuthController). Phiên lưu trong bộ nhớ: khởi động lại backend là phải đăng nhập lại.
server.servlet.session.cookie.name=RMS_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h
server.servlet.session.tracking-modes=cookie
