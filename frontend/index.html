<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Icon nằm trong dự án (public/favicon.svg): không phụ thuộc máy chủ ngoài. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Lotus — Restaurant Manager</title>
    <meta name="description" content="Hệ thống quản lý nhà hàng Green Lotus." />
    <script>
      // Áp chế độ sáng / tối đã lưu TRƯỚC khi vẽ trang, để màn hình chờ không chớp trắng ở chế độ tối.
      try {
        var t = localStorage.getItem('rms-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <style>
      /* Màn hình chờ (dùng chung cho lúc tải trang lần đầu và lúc kiểm tra đăng nhập — xem components/common/PageLoader.tsx). */
      .rl {
        position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px; background: #f6f8f7; color: #3b4541;
        font-family: 'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      [data-theme='dark'] .rl { background: #0c1411; color: #c9d4cf; }
      /* Chỉ hiện khi phải chờ quá 0,3 giây (tải nhanh thì không thấy, tránh nháy màn hình), rồi mờ dần lên.
         .rl-now: hiện ngay, không mờ dần — React dùng khi người dùng đã chờ quá 0,3 giây (nối tiếp màn hình chờ của HTML). */
      .rl > * { opacity: 0; animation: rl-in 0.25s ease-out 0.3s forwards; }
      .rl.rl-now > * { opacity: 1; animation: none; }
      @keyframes rl-in { to { opacity: 1; } }
      .rl-stage { position: relative; width: 300px; height: 80px; }
      .rl-mouth { position: absolute; left: 0; top: 4px; width: 72px; height: 72px; z-index: 2; }
      .rl-mouth::before, .rl-mouth::after { content: ''; position: absolute; left: 0; width: 72px; height: 37px; background: #8cc63f; }
      .rl-mouth::before { top: 0; border-radius: 36px 36px 0 0; transform-origin: 50% 100%; animation: rl-top 0.5s ease-in-out infinite; }
      .rl-mouth::after { top: 35px; border-radius: 0 0 36px 36px; transform-origin: 50% 0; animation: rl-bottom 0.5s ease-in-out infinite; }
      @keyframes rl-top { 0%, 100% { transform: rotate(-38deg); } 50% { transform: rotate(0); } }
      @keyframes rl-bottom { 0%, 100% { transform: rotate(38deg); } 50% { transform: rotate(0); } }
      .rl-window { position: absolute; left: 36px; top: 0; width: 264px; height: 80px; overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, #000 75%, transparent); mask-image: linear-gradient(90deg, #000 75%, transparent); }
      .rl-track { display: flex; width: max-content; padding-left: 40px; animation: rl-move 2s linear infinite; }
      .rl-track svg { flex: none; width: 40px; height: 40px; margin: 20px 9px; color: #2f3a35; }
      [data-theme='dark'] .rl-track svg { color: #dfe8e3; }
      @keyframes rl-move { from { transform: translateX(0); } to { transform: translateX(-232px); } }
      .rl-text { font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
      .rl-dots::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: rl-dots 1.2s steps(4, end) infinite; }
      @keyframes rl-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }
      @media (prefers-reduced-motion: reduce) {
        .rl-mouth::before, .rl-mouth::after, .rl-track, .rl-dots::after { animation: none; }
        .rl-dots::after { content: '...'; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Hiện ngay khi trang vừa mở; React thay thế khi đã tải xong. -->
      <div class="rl" role="status" aria-live="polite">
        <div class="rl-stage" aria-hidden="true">
          <div class="rl-mouth"></div>
          <div class="rl-window">
            <div class="rl-track">
              <!-- Bò bít tết -->
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="27" rx="16" ry="6"/><path d="M9 23c0-5 6-9 12-9s10 3 10 6c0 4-6 7-11 7s-11 0-11-4Z"/><path d="M15 20c2 1 4 0 6 1M18 24c2-1 4 0 6-1"/><path d="M28 12c2-3 5-3 6-2-1 3-4 4-6 2Z" stroke="#8cc63f"/></svg>
              <!-- Hamburger -->
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18a12 9 0 0 1 24 0Z"/><path d="M16 13h.01M21 12h.01M25 14h.01"/><path d="M7 22c2 2 3 0 5 1s3 2 5 0 3-1 5 0 3 2 5 0 3-1 6 0" stroke="#8cc63f"/><rect x="8" y="25" width="24" height="3" rx="1.5"/><path d="M8 31h24a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3Z"/></svg>
              <!-- Ly nước -->
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14h16l-2 20H14Z"/><path d="M10 14h20"/><path d="M21 14l3-9h4"/><path d="M13 23h14" stroke="#8cc63f"/></svg>
              <!-- Khoai tây chiên -->
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 19V9M18 19V6M22 19V8M26 19V10"/><path d="M10 19h20l-3 15H13Z"/><circle cx="20" cy="26" r="2.5" stroke="#8cc63f"/></svg>
              <!-- Lặp lại để chạy liền mạch -->
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="27" rx="16" ry="6"/><path d="M9 23c0-5 6-9 12-9s10 3 10 6c0 4-6 7-11 7s-11 0-11-4Z"/><path d="M15 20c2 1 4 0 6 1M18 24c2-1 4 0 6-1"/><path d="M28 12c2-3 5-3 6-2-1 3-4 4-6 2Z" stroke="#8cc63f"/></svg>
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18a12 9 0 0 1 24 0Z"/><path d="M16 13h.01M21 12h.01M25 14h.01"/><path d="M7 22c2 2 3 0 5 1s3 2 5 0 3-1 5 0 3 2 5 0 3-1 6 0" stroke="#8cc63f"/><rect x="8" y="25" width="24" height="3" rx="1.5"/><path d="M8 31h24a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3Z"/></svg>
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14h16l-2 20H14Z"/><path d="M10 14h20"/><path d="M21 14l3-9h4"/><path d="M13 23h14" stroke="#8cc63f"/></svg>
              <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 19V9M18 19V6M22 19V8M26 19V10"/><path d="M10 19h20l-3 15H13Z"/><circle cx="20" cy="26" r="2.5" stroke="#8cc63f"/></svg>
            </div>
          </div>
        </div>
        <p class="rl-text"><span>Chờ chút, món ngon sắp lên</span><span class="rl-dots"></span></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
