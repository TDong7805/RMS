<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- Icon nằm trong dự án (public/favicon.svg): không phụ thuộc máy chủ ngoài. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Royal Beef — Quản lý nhà hàng</title>
    <meta name="description" content="Hệ thống quản lý nhà hàng Royal Beef." />
    <script>
      // Áp chế độ sáng / tối đã lưu TRƯỚC khi vẽ trang, để màn hình chờ không chớp trắng ở chế độ tối.
      try {
        var t = localStorage.getItem('rms-theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <style>
      /* Màn hình chờ (dùng chung cho lúc tải trang lần đầu và lúc kiểm tra đăng nhập — xem components/common/PageLoader.tsx).
         Hình: thớt gỗ, miếng steak chín dần từ trái sang (thanh "độ chín"), dao nĩa vàng đồng, hương thảo, tiêu muối, khói bốc. Màu Royal Beef. */
      .rl {
        position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: clamp(14px, 4vw, 24px); padding: 24px; background: #faf6f0; color: #2a1f1a;
        font-family: 'Be Vietnam Pro', 'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      [data-theme='dark'] .rl { background: #17110e; color: #efe6dc; }
      /* Chỉ hiện khi phải chờ quá 0,3 giây (tải nhanh thì không thấy, tránh nháy màn hình), rồi mờ dần lên.
         .rl-now: hiện ngay, không mờ dần — React dùng khi người dùng đã chờ quá 0,3 giây (nối tiếp màn hình chờ của HTML). */
      .rl > * { opacity: 0; animation: rl-in 0.25s ease-out 0.3s forwards; }
      .rl.rl-now > * { opacity: 1; animation: none; }
      @keyframes rl-in { to { opacity: 1; } }
      .rl-art { display: block; width: min(340px, 84vw); height: auto; overflow: visible; }
      .rl-shadow { fill: rgba(60, 30, 15, 0.14); }
      [data-theme='dark'] .rl-shadow { fill: rgba(0, 0, 0, 0.45); }
      .rl-wood-a { stop-color: #c99766; } .rl-wood-b { stop-color: #a8734a; }
      [data-theme='dark'] .rl-wood-a { stop-color: #8a5d3b; } [data-theme='dark'] .rl-wood-b { stop-color: #6b4329; }
      .rl-board { stroke: rgba(70, 35, 15, 0.25); stroke-width: 1.5; }
      .rl-hole { fill: #faf6f0; } [data-theme='dark'] .rl-hole { fill: #17110e; }
      .rl-grain { fill: none; stroke: rgba(70, 35, 15, 0.18); stroke-width: 1.5; stroke-linecap: round; }
      .rl-herb { fill: #5f7d4a; stroke: #4c6a3b; stroke-width: 1.6; stroke-linecap: round; }
      .rl-raw { fill: #c23a44; }
      .rl-cook { transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
        animation: rl-cook 3.6s cubic-bezier(.45, .05, .35, 1) infinite; }
      @keyframes rl-cook {
        0% { transform: scaleX(0); fill: #e0707a; opacity: 1; }
        45% { fill: #c98a73; }
        80% { transform: scaleX(1); fill: #8a5338; opacity: 1; }
        92% { transform: scaleX(1); fill: #7a4630; opacity: 0; }
        100% { transform: scaleX(1); opacity: 0; }
      }
      .rl-marble { fill: none; stroke: rgba(255, 236, 220, 0.55); stroke-width: 2; stroke-linecap: round; }
      .rl-fat { fill: none; stroke: #f3e2c6; stroke-width: 4; stroke-linecap: round; opacity: 0.85; }
      .rl-sear { fill: none; stroke: rgba(50, 20, 10, 0.32); stroke-width: 3.5; stroke-linecap: round; }
      .rl-crust { fill: none; stroke: #5a2a18; stroke-width: 4.5; stroke-linejoin: round; }
      .rl-pepper { fill: #2e221c; } [data-theme='dark'] .rl-pepper { fill: #0e0907; }
      .rl-salt { fill: #fffaf2; }
      .rl-steam path { fill: none; stroke: #b8925a; stroke-width: 2.4; stroke-linecap: round; opacity: 0;
        transform-box: fill-box; animation: rl-steam 2.4s ease-in-out infinite; }
      [data-theme='dark'] .rl-steam path { stroke: #d9bb88; }
      .rl-steam path:nth-child(2) { animation-delay: 0.8s; }
      .rl-steam path:nth-child(3) { animation-delay: 1.6s; }
      @keyframes rl-steam { 0% { opacity: 0; transform: translateY(8px); } 35% { opacity: 0.7; } 100% { opacity: 0; transform: translateY(-10px); } }
      .rl-tool { fill: none; stroke: #b8925a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .rl-tool .rl-blade { fill: #d9bb88; stroke-width: 2.5; }
      [data-theme='dark'] .rl-tool { stroke: #d9bb88; } [data-theme='dark'] .rl-tool .rl-blade { fill: #b8925a; }
      .rl-text { margin: 0; font-size: clamp(16px, 4.4vw, 21px); font-weight: 600; letter-spacing: 0.2px; text-align: center; }
      .rl-dots::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: rl-dots 1.2s steps(4, end) infinite; }
      @keyframes rl-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }
      @media (prefers-reduced-motion: reduce) {
        .rl-cook { animation: none; transform: scaleX(0.6); fill: #c98a73; }
        .rl-steam path { animation: none; opacity: 0.5; }
        .rl-dots::after { animation: none; content: '...'; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Hiện ngay khi trang vừa mở; React thay thế khi đã tải xong. -->
      <div class="rl" role="status" aria-live="polite">
        <svg class="rl-art" viewBox="0 0 320 176" aria-hidden="true"><defs><clipPath id="rl-steak"><path d="M80 108c2-12 18-19 42-18 20 1 34-4 58-3 28 1 56 3 62 17 5 12-1 24-20 29-22 5-44 0-68 2-26 2-52 7-66-3-9-6-10-15-8-24z"/></clipPath><linearGradient id="rl-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="rl-wood-a"/><stop offset="1" class="rl-wood-b"/></linearGradient></defs><ellipse cx="160" cy="160" rx="132" ry="9" class="rl-shadow"/><rect x="34" y="74" width="232" height="80" rx="24" fill="url(#rl-wood)" class="rl-board"/><rect x="258" y="100" width="40" height="28" rx="14" fill="url(#rl-wood)" class="rl-board"/><circle cx="285" cy="114" r="5" class="rl-hole"/><path d="M52 92c40-6 80 4 120-2s60-4 80 2M48 136c50 5 90-4 140 1s50 2 64-2" class="rl-grain"/><g class="rl-herb"><path d="M46 84l46 22"/><ellipse cx="54" cy="82" rx="6" ry="2.4" transform="rotate(-30 54 82)"/><ellipse cx="58" cy="94" rx="6" ry="2.4" transform="rotate(50 58 94)"/><ellipse cx="66" cy="87" rx="6" ry="2.4" transform="rotate(-30 66 87)"/><ellipse cx="70" cy="99" rx="6" ry="2.4" transform="rotate(50 70 99)"/><ellipse cx="78" cy="93" rx="6" ry="2.4" transform="rotate(-30 78 93)"/><ellipse cx="82" cy="105" rx="6" ry="2.4" transform="rotate(50 82 105)"/></g><path d="M80 108c2-12 18-19 42-18 20 1 34-4 58-3 28 1 56 3 62 17 5 12-1 24-20 29-22 5-44 0-68 2-26 2-52 7-66-3-9-6-10-15-8-24z" class="rl-raw"/><g clip-path="url(#rl-steak)"><rect x="76" y="86" width="170" height="56" class="rl-cook"/><path d="M96 104c10 3 16-2 26 1M150 122c12-3 18 2 30-1M196 106c8 2 14-1 22 1" class="rl-marble"/><path d="M104 88l-20 52M136 88l-20 52M168 88l-20 52M200 88l-20 52M232 88l-20 52M264 88l-20 52" class="rl-sear"/><path d="M90 102c10-8 26-9 40-8 22 1 36-4 58-3 22 1 40 1 52 8" class="rl-fat"/></g><path d="M80 108c2-12 18-19 42-18 20 1 34-4 58-3 28 1 56 3 62 17 5 12-1 24-20 29-22 5-44 0-68 2-26 2-52 7-66-3-9-6-10-15-8-24z" class="rl-crust"/><g class="rl-pepper"><circle cx="232" cy="146" r="2.6"/><circle cx="240" cy="142" r="2.2"/><circle cx="226" cy="140" r="2"/><circle cx="246" cy="148" r="2.4"/></g><g class="rl-salt"><rect x="214" y="146" width="3" height="3" rx=".6"/><rect x="252" y="140" width="2.6" height="2.6" rx=".6"/><rect x="220" y="150" width="2.4" height="2.4" rx=".6"/></g><g class="rl-steam"><path d="M124 84c-6-8 6-14 0-22s6-14 0-22"/><path d="M160 82c-6-8 6-14 0-22s6-14 0-22"/><path d="M196 84c-6-8 6-14 0-22s6-14 0-22"/></g><g class="rl-tool"><path d="M9 40v16a9 9 0 0 0 18 0V40"/><path d="M15 40v15M21 40v15"/><path d="M18 65v93"/></g><g class="rl-tool"><path d="M306 40c-8 10-10 26-6 40v6h6z" class="rl-blade"/><path d="M303 86v72"/></g></svg>
        <p class="rl-text"><span>Chờ chút, món ngon sắp lên</span><span class="rl-dots"></span></p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
